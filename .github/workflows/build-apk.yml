name: Android CI

on:
  push:
    branches:
      - '**'
    tags:
      - '**'
  pull_request:
  workflow_dispatch:

permissions: {}

concurrency:
  group: android-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

env:
  APP_VERSION: 15.9.0-Mobile

jobs:
  debug:
    name: Lint, test, and build debug APK
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    permissions:
      contents: read

    steps:
      - name: Check out repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false

      - name: Set up JDK 17
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Validate Gradle Wrapper
        uses: gradle/actions/wrapper-validation@0723195856401067f7a2779048b490ace7a47d7c # v5

      - name: Set up Gradle cache
        uses: gradle/actions/setup-gradle@0723195856401067f7a2779048b490ace7a47d7c # v5
        with:
          cache-cleanup: on-success
          cache-read-only: ${{ github.ref != format('refs/heads/{0}', github.event.repository.default_branch) }}
          validate-wrappers: false

      - name: Install Android SDK 36
        uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3
        with:
          cmdline-tools-version: '12266719'
          accept-android-sdk-licenses: true
          log-accepted-android-sdk-licenses: false
          packages: >-
            platform-tools
            platforms;android-36
            build-tools;36.0.0

      - name: Enable Gradle Wrapper execution
        run: chmod +x gradlew

      - name: Lint, unit test, and build
        run: ./gradlew --no-daemon --stacktrace lintDebug testDebugUnitTest assembleDebug

      - name: Name APK and calculate SHA-256
        id: debug_package
        shell: bash
        run: |
          set -euo pipefail
          short_sha="${GITHUB_SHA:0:12}"
          apk_name="ChessCoach-${APP_VERSION}-${short_sha}-debug.apk"
          mkdir -p artifacts
          cp app/build/outputs/apk/debug/app-debug.apk "artifacts/${apk_name}"
          cp LICENSE APACHE-2.0.txt THIRD_PARTY_NOTICES.md artifacts/
          (
            cd artifacts
            sha256sum "${apk_name}" > "${apk_name}.sha256"
          )
          echo "short_sha=${short_sha}" >> "${GITHUB_OUTPUT}"
          echo '### Debug APK SHA-256' >> "${GITHUB_STEP_SUMMARY}"
          echo '```text' >> "${GITHUB_STEP_SUMMARY}"
          cat "artifacts/${apk_name}.sha256" | tee -a "${GITHUB_STEP_SUMMARY}"
          echo '```' >> "${GITHUB_STEP_SUMMARY}"

      - name: Upload debug APK
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5
        with:
          name: ChessCoach-${{ env.APP_VERSION }}-${{ steps.debug_package.outputs.short_sha }}-debug-apk
          path: artifacts/
          if-no-files-found: error
          retention-days: 14
          compression-level: 0

  signing_secrets:
    name: Check release signing secrets
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions: {}
    outputs:
      available: ${{ steps.check.outputs.available }}

    steps:
      - name: Check required secrets
        id: check
        shell: bash
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          set -euo pipefail
          if [[ -n "${ANDROID_KEYSTORE_BASE64}" && -n "${STORE_PASSWORD}" && -n "${KEY_ALIAS}" && -n "${KEY_PASSWORD}" ]]; then
            echo 'available=true' >> "${GITHUB_OUTPUT}"
          else
            echo 'available=false' >> "${GITHUB_OUTPUT}"
            echo 'Signed release skipped because one or more signing secrets are missing.' >> "${GITHUB_STEP_SUMMARY}"
          fi

  release:
    name: Build signed release APK and AAB
    needs:
      - debug
      - signing_secrets
    if: startsWith(github.ref, 'refs/tags/') && needs.debug.result == 'success' && needs.signing_secrets.outputs.available == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: read

    steps:
      - name: Check out repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false

      - name: Set up JDK 17
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Validate Gradle Wrapper
        uses: gradle/actions/wrapper-validation@0723195856401067f7a2779048b490ace7a47d7c # v5

      - name: Set up Gradle cache
        uses: gradle/actions/setup-gradle@0723195856401067f7a2779048b490ace7a47d7c # v5
        with:
          cache-cleanup: on-success
          cache-read-only: true
          validate-wrappers: false

      - name: Install Android SDK 36
        uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3
        with:
          cmdline-tools-version: '12266719'
          accept-android-sdk-licenses: true
          log-accepted-android-sdk-licenses: false
          packages: >-
            platform-tools
            platforms;android-36
            build-tools;36.0.0

      - name: Enable Gradle Wrapper execution
        run: chmod +x gradlew

      - name: Decode release keystore
        id: signing
        shell: bash
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          umask 077
          keystore_path="${RUNNER_TEMP}/chesscoach-release.keystore"
          printf '%s' "${ANDROID_KEYSTORE_BASE64}" | base64 --decode > "${keystore_path}"
          test -s "${keystore_path}"
          echo "keystore_path=${keystore_path}" >> "${GITHUB_OUTPUT}"

      - name: Build signed release APK and AAB
        env:
          ANDROID_KEYSTORE_FILE: ${{ steps.signing.outputs.keystore_path }}
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: ./gradlew --no-daemon --stacktrace assembleRelease bundleRelease

      - name: Verify release signatures
        shell: bash
        run: |
          set -euo pipefail
          "${ANDROID_HOME}/build-tools/36.0.0/apksigner" verify --verbose --print-certs app/build/outputs/apk/release/app-release.apk
          jarsigner -verify app/build/outputs/bundle/release/app-release.aab >/dev/null 2>&1
          echo 'AAB JAR signature verified.'

      - name: Name release artifacts and calculate SHA-256
        id: release_package
        shell: bash
        run: |
          set -euo pipefail
          short_sha="${GITHUB_SHA:0:12}"
          apk_name="ChessCoach-${APP_VERSION}-${short_sha}-release.apk"
          aab_name="ChessCoach-${APP_VERSION}-${short_sha}-release.aab"
          mkdir -p artifacts
          cp app/build/outputs/apk/release/app-release.apk "artifacts/${apk_name}"
          cp app/build/outputs/bundle/release/app-release.aab "artifacts/${aab_name}"
          cp LICENSE APACHE-2.0.txt THIRD_PARTY_NOTICES.md artifacts/
          (
            cd artifacts
            sha256sum "${apk_name}" "${aab_name}" > SHA256SUMS.txt
          )
          echo "short_sha=${short_sha}" >> "${GITHUB_OUTPUT}"
          echo '### Signed release SHA-256' >> "${GITHUB_STEP_SUMMARY}"
          echo '```text' >> "${GITHUB_STEP_SUMMARY}"
          cat artifacts/SHA256SUMS.txt | tee -a "${GITHUB_STEP_SUMMARY}"
          echo '```' >> "${GITHUB_STEP_SUMMARY}"

      - name: Upload signed release APK and AAB
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5
        with:
          name: ChessCoach-${{ env.APP_VERSION }}-${{ steps.release_package.outputs.short_sha }}-signed-release
          path: artifacts/
          if-no-files-found: error
          retention-days: 30
          compression-level: 0

      - name: Delete decoded keystore
        if: always()
        shell: bash
        run: rm -f "${RUNNER_TEMP}/chesscoach-release.keystore"
